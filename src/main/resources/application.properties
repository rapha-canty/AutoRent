spring.application.name=autorent

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autorent?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

server.port=${SERVER_PORT:8080}
server.error.include-message=never

autorent.login.max-tentativas=${LOGIN_MAX_TENTATIVAS:3}
autorent.login.bloqueio-minutos=${LOGIN_BLOQUEIO_MINUTOS:10}

autorent.multa.fator-diaria=${MULTA_FATOR_DIARIA:1.0}
autorent.multa.tolerancia-minutos=${MULTA_TOLERANCIA_MINUTOS:60}
